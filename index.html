THESIS: The organiser's dashboard is the event's gig poster with the box office stapled under it: art and title on top, then the registrations sheet, one blue "Generate N passes" plate, and the live "Checked in N / total". Refuses the SaaS admin (sidebar, KPI tiles, data grid).
OWN-WORLD: Warm paper #F3EBEA with fibre grain; fluoro pink #FF2FA2 and deep blue #1A43B4 riso inks with paper dropouts on filled surfaces; pink-tint #F8D5E4 rows with 12px corners; Oswald condensed print voice, Barlow Semi Condensed for reading; dotted pink rules; scalloped stub at the foot.
STORY: Sign in with a magic link, make the event, drop in the sheet, generate passes, send links yourself, hand staff the gate code, watch the counter climb.
FIRST VIEWPORT: (event) GatePass wordmark + ORGANISER; square riso poster with the title in fluoro pink and the club in blue; registrations row; blue Generate plate; Checked-in card with the pink bar.
FORM: Pinned by the user: concept A "gig poster" (ui-concepts/gatepass/gatepass_a_gigposter.png). No seed roll: user-pinned.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
